<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Clientes | Melanie Marin</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="/assets/logo.jpg" alt="Logo Melanie Marin" class="nav-logo-img">
        <div class="brand-text">
          <span class="brand-name">Melanie Marin</span>
          <span class="brand-tagline">Estética Avanzada</span>
        </div>
      </a>
      
      <button class="hamburger" id="hamburgerBtn" aria-label="Abrir Menú">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>

      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html" class="nav-link">Inicio</a></li>
        <li><a href="servicios.html" class="nav-link">Tratamientos</a></li>
        <li><a href="contacto.html" class="nav-link">Citas</a></li>
        <li><a href="login.html" class="nav-link btn-nav">Acceso Clientes</a></li>
      </ul>
    </div>
  </header>

  <main class="container form-wrapper">
    <div class="form-box">
      <h1 class="section-title" style="font-size: 2rem;">Acceso Privado</h1>
      <p class="section-subtitle">Gestión de Citas y Tratamientos</p>
      
      <form id="loginForm">
        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">Iniciar Sesión</button>
        <p id="authMessage" class="auth-feedback"></p>
      </form>
    </div>
  </main>

  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
